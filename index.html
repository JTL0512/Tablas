<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Multiplicadora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e27;
            --primary: #00d4ff;
            --secondary: #7c4dff;
            --gold: #ffd700;
            --text-color: #ffffff;
            --card-bg: rgba(30, 33, 72, 0.85);
            --error-color: #ff4757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Starfield Background */
        .stars, .stars2, .stars3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .stars {
            background: transparent url('data:image/svg+xml;utf8,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="1.5" fill="white" opacity="0.8"/><circle cx="150" cy="50" r="1.5" fill="white" opacity="0.6"/><circle cx="80" cy="120" r="1.5" fill="white" opacity="0.9"/><circle cx="180" cy="180" r="1.5" fill="white" opacity="0.4"/></svg>') repeat;
            animation: animStar 50s linear infinite;
        }

        .stars2 {
            background: transparent url('data:image/svg+xml;utf8,<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="80" r="2" fill="white" opacity="0.7"/><circle cx="200" cy="150" r="2" fill="white" opacity="0.5"/><circle cx="100" cy="250" r="2" fill="white" opacity="0.8"/></svg>') repeat;
            animation: animStar 100s linear infinite;
        }

        .stars3 {
            background: transparent url('data:image/svg+xml;utf8,<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="50" r="2.5" fill="white" opacity="0.6"/><circle cx="300" cy="200" r="2.5" fill="white" opacity="0.9"/><circle cx="50" cy="350" r="2.5" fill="white" opacity="0.4"/></svg>') repeat;
            animation: animStar 150s linear infinite;
        }

        @keyframes animStar {
            from { transform: translateY(0); }
            to { transform: translateY(-1000px); }
        }

        /* Floating elements */
        .floating-element {
            position: absolute;
            z-index: -1;
            font-size: 3rem;
            animation: float 6s ease-in-out infinite;
        }

        .el-1 { top: 15%; left: 10%; animation-delay: 0s; font-size: 4rem; }
        .el-2 { top: 70%; left: 15%; animation-delay: 1s; font-size: 3.5rem; }
        .el-3 { top: 20%; right: 15%; animation-delay: 2s; font-size: 4.5rem; }
        .el-4 { top: 60%; right: 10%; animation-delay: 3s; font-size: 3rem; }
        .el-5 { top: 85%; left: 50%; animation-delay: 4s; font-size: 2.5rem; }
        .el-6 { top: 10%; left: 45%; animation-delay: 1.5s; font-size: 2rem; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 1;
            margin: 2rem 0;
        }

        /* Header */
        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.7), 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px rgba(0, 212, 255, 0.7), 0 0 20px rgba(0, 212, 255, 0.5); }
            100% { text-shadow: 0 0 15px rgba(0, 212, 255, 0.9), 0 0 30px rgba(0, 212, 255, 0.7), 0 0 40px rgba(0, 212, 255, 0.4); }
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e0e0e0;
        }

        .header-emoji {
            font-size: 4rem;
            display: inline-block;
            margin-bottom: 10px;
            animation: rocket-shake 2s infinite ease-in-out;
        }

        @keyframes rocket-shake {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(-5deg); }
            75% { transform: translateY(5px) rotate(5deg); }
        }

        /* Form Card */
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--gold);
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Avatars */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .avatar-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70px;
        }

        .avatar-btn:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        .avatar-btn.selected {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            transform: scale(1.1);
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 15px 30px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(124, 77, 255, 0.4);
            margin-top: 1rem;
            font-family: 'Nunito', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.6);
        }

        .btn-submit:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Error States */
        .error-msg {
            color: var(--error-color);
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 5px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--error-color) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Welcome Back Msg */
        .welcome-back {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: none;
        }

        /* Footer */
        footer {
            margin-top: 3rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            font-size: 1rem;
        }

        /* Success Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .success-msg {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            text-align: center;
            transform: scale(0.5);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-overlay.show .success-msg {
            transform: scale(1);
        }

        .success-stars {
            font-size: 4rem;
            margin-top: 1rem;
            animation: spin 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            .avatar-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
            .avatar-btn { font-size: 2rem; height: 60px; }
            .login-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Starfield Layers -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <!-- Floating Emojis -->
    <div class="floating-element el-1">🪐</div>
    <div class="floating-element el-2">🌍</div>
    <div class="floating-element el-3">⭐</div>
    <div class="floating-element el-4">🌙</div>
    <div class="floating-element el-5">☀️</div>
    <div class="floating-element el-6">🌌</div>

    <div class="container">
        <header>
            <div class="header-emoji">🚀</div>
            <h1>Galaxia Multiplicadora</h1>
            <p class="subtitle">Aprende las tablas de multiplicar explorando el universo</p>
        </header>

        <div class="login-card">
            <div class="welcome-back" id="welcome-msg">¡Bienvenido/a de vuelta, <span id="welcome-name"></span>!</div>
            
            <div class="input-group">
                <label for="input-nombre">¿Cómo te llamas, astronauta?</label>
                <input type="text" id="input-nombre" placeholder="Escribe tu nombre aquí..." autocomplete="off">
                <div class="error-msg" id="error-nombre">¡Necesitas un nombre para tu misión!</div>
            </div>

            <div class="input-group">
                <label>Elige tu avatar espacial:</label>
                <div class="avatar-grid" id="avatar-container">
                    <!-- Avatars injected via JS -->
                </div>
                <div class="error-msg" id="error-avatar">¡Elige tu compañero de viaje espacial!</div>
            </div>

            <button class="btn-submit" id="btn-ingresar">¡Iniciar Aventura! 🚀</button>
        </div>

        <footer>
            🌟 Una aventura matemática por las estrellas 🌟
        </footer>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-msg" id="success-text">¡Bienvenido/a!</div>
        <div class="success-stars">✨</div>
    </div>

    <script>
        const avatars = ['🧑‍🚀','👩‍🚀','👨‍🚀','🤖','👽','🦸‍♀️','🦸‍♂️','🧙‍♂️'];
        let selectedAvatarIndex = null;

        const avatarContainer = document.getElementById('avatar-container');
        const inputNombre = document.getElementById('input-nombre');
        const btnIngresar = document.getElementById('btn-ingresar');
        const errorNombre = document.getElementById('error-nombre');
        const errorAvatar = document.getElementById('error-avatar');
        const welcomeMsg = document.getElementById('welcome-msg');
        const welcomeName = document.getElementById('welcome-name');
        const successOverlay = document.getElementById('success-overlay');
        const successText = document.getElementById('success-text');

        // Render avatars
        avatars.forEach((emoji, index) => {
            const btn = document.createElement('button');
            btn.className = 'avatar-btn';
            btn.textContent = emoji;
            btn.dataset.index = index;
            btn.onclick = () => selectAvatar(index);
            avatarContainer.appendChild(btn);
        });

        function selectAvatar(index) {
            selectedAvatarIndex = index;
            document.querySelectorAll('.avatar-btn').forEach(btn => {
                if (parseInt(btn.dataset.index) === index) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
            errorAvatar.style.display = 'none';
            avatarContainer.classList.remove('shake');
        }

        // Clear error on input
        inputNombre.addEventListener('input', () => {
            errorNombre.style.display = 'none';
            inputNombre.classList.remove('shake');
        });

        // Load existing data
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('galaxiaMultiplicadora');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    if (data.nombre) {
                        inputNombre.value = data.nombre;
                        welcomeName.textContent = data.nombre;
                        welcomeMsg.style.display = 'block';
                    }
                    if (data.avatar !== undefined && data.avatar !== null) {
                        selectAvatar(data.avatar);
                    }
                } catch (e) {
                    console.error("Error parsing local storage", e);
                }
            }
        });

        // Handle login
        btnIngresar.addEventListener('click', () => {
            const nombre = inputNombre.value.trim();
            let isValid = true;

            // Validate name
            if (nombre.length < 2) {
                errorNombre.style.display = 'block';
                inputNombre.classList.remove('shake');
                void inputNombre.offsetWidth; // trigger reflow
                inputNombre.classList.add('shake');
                isValid = false;
            }

            // Validate avatar
            if (selectedAvatarIndex === null) {
                errorAvatar.style.display = 'block';
                avatarContainer.classList.remove('shake');
                void avatarContainer.offsetWidth; // trigger reflow
                avatarContainer.classList.add('shake');
                isValid = false;
            }

            if (!isValid) return;

            // Save or Update data
            const savedDataStr = localStorage.getItem('galaxiaMultiplicadora');
            let data;
            
            if (savedDataStr) {
                try {
                    data = JSON.parse(savedDataStr);
                    data.nombre = nombre;
                    data.avatar = selectedAvatarIndex;
                } catch (e) {
                    data = createDefaultData(nombre, selectedAvatarIndex);
                }
            } else {
                data = createDefaultData(nombre, selectedAvatarIndex);
            }

            localStorage.setItem('galaxiaMultiplicadora', JSON.stringify(data));

            // Success animation & redirect
            successText.textContent = `¡Bienvenido/a, ${nombre}!`;
            successOverlay.classList.add('show');
            
            setTimeout(() => {
                window.location.href = 'Sistema/index.html';
            }, 1500);
        });

        function createDefaultData(nombre, avatar) {
            return {
                nombre: nombre,
                avatar: avatar,
                puntajeTotal: 0,
                tablas: {
                    '2': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '3': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '4': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '5': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '6': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '7': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '8': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '9': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] },
                    '10': { aprendida: false, puntaje: 0, estrellas: 0, juegosCompletados: [] }
                },
                logros: [],
                simceDesbloqueado: false,
                simceResultado: null
            };
        }
    </script>
</body>
</html>
